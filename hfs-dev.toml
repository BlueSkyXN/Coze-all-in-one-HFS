standard = "2.1"
project = "coze-all-in-one-hfs"
space = "BlueSkyXN/Coze-all-in-one-HFS"
sovereignty = "port"
# The v2 registry uses artifact because the delivered Coze server/web payloads
# are artifacts. This remains a hybrid implementation because the reviewable
# Pattern A wrapper and the verified infrastructure-image deviations stay here.
lane = "artifact"
version_source = "commit"
project_class = "preview"
target_role = "primary"
space_visibility = "protected"
bucket_visibility = "private"
env_file = ".env"
secret_files = []

# Local control-plane credentials only. They are never sent to the Space.
local_only = ["HF_TOKEN", "GH_TOKEN"]

# Key names only; local plaintext .env is authoritative and Space Settings are deployment copies.
secrets = [
  "COZE_RUNTIME_DOWNLOAD_TOKEN",
  "OPS_TOKEN",
]
optional_secrets = [
  "ADMIN_TOKEN",
  "ADMIN_CSRF_KEY",
  "MODEL_API_KEY_0",
  "BUILTIN_CM_OPENAI_API_KEY",
  "OPENAI_EMBEDDING_API_KEY",
  "S3_ACCESS_KEY",
  "S3_SECRET_KEY",
  "ES_PASSWORD",
  "VIKING_DB_AK",
  "VIKING_DB_SK",
  "TOS_ACCESS_KEY",
  "TOS_SECRET_KEY",
]
variables = [
  "COZE_RUNTIME_MANIFEST_URI",
  "DISABLE_USER_REGISTRATION",
  "ENABLE_LOCAL_MINIO",
  "COZE_PUBLIC_URL",
  "LOG_LEVEL",
  "PERSISTENCE_REQUIRED",
  "CODE_RUNNER_TYPE",
  "CODE_RUNNER_ALLOW_NET",
  "CODE_RUNNER_TIMEOUT_SECONDS",
  "CODE_RUNNER_MEMORY_LIMIT_MB",
  "ADMIN_ENABLED",
  "FILE_UPLOAD_COMPONENT_TYPE",
  "STORAGE_TYPE",
  "STORAGE_BUCKET",
  "ES_ADDR",
  "ES_VERSION",
  "VECTOR_STORE_TYPE",
]

dist_bucket = "hfs-dist"
# This port has no deployable configuration seed; runtime config stays upstream-managed.
seed_file = ""
other_objects = []

deviations = [
  "hybrid-wrapper = Pattern A wrapper remains source-reviewed while only Coze server/web are manifest-selected artifacts.",
  "business-image = Elasticsearch, etcd, and Milvus remain digest-pinned image inputs until each extraction, dynamic-library, cold-start, and persistence proof is approved.",
]
